# Tooling config for the workstation CLI only. The Android app is built by Gradle and has
# nothing to do with this file.
[tool.ruff]
line-length = 110
target-version = "py311"
# The CLI is an executable script with no .py extension. Without this ruff silently matches
# nothing under cli/ and every check passes while linting the test file alone.
extend-include = ["cli/kata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

