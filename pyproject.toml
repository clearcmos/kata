# Tooling config for the workstation CLI only. The Android app is built by Gradle and has
# nothing to do with this file.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The CLI is a single executable script without a .py extension; ruff still lints it by path.
"cli/kata" = []
