name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.14.4"
      - name: Format and lint
        run: gradle ktlintCheck :app:lintDebug
      - name: Unit tests with coverage gate
        run: gradle :app:testDebugUnitTest :app:koverVerifyDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      # The lockfiles are the ecosystem lockfile; a dependency that moved without one being
      # regenerated is a supply-chain change nobody reviewed.
      - name: Dependency locks are current
        run: git diff --exit-code -- '*.lockfile'

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned here rather than via a third-party action, which would be one more SHA to keep
      # honest for no gain.
      RUFF_VERSION: "0.15.22"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"
      - name: Lint
        run: ruff check cli tests
      - name: Format check
        run: ruff format --check cli tests
      - name: CLI tests
        run: python3 -m unittest discover -s tests -v

  ci-ok:
    needs: [android, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo ok
